name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Run tests
      run: cargo test --locked

    - name: Run clippy
      run: cargo clippy --all-targets --all-features --locked -- -D warnings

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, platform: linux_amd64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, platform: linux_arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: darwin_amd64 }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: darwin_arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows_amd64 }
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Build binary
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Package (unix)
      if: runner.os != 'Windows'
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        mkdir -p dist
        cp "target/${{ matrix.target }}/release/ghr" dist/ghr
        tar -czf "dist/ghr_${VERSION}_${{ matrix.platform }}.tar.gz" -C dist ghr
        rm dist/ghr

    - name: Package (windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF_NAME -replace '^v', ''
        New-Item -ItemType Directory -Force dist | Out-Null
        Copy-Item "target/${{ matrix.target }}/release/ghr.exe" dist/ghr.exe
        Compress-Archive -Path dist/ghr.exe -DestinationPath "dist/ghr_${version}_${{ matrix.platform }}.zip"
        Remove-Item dist/ghr.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ghr-${{ matrix.platform }}
        path: dist/*
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Generate checksums
      run: |
        cd dist
        sha256sum *.tar.gz *.zip > checksums.txt
        cat checksums.txt

    - name: Extract release notes from CHANGELOG
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        # index() keeps this literal: no regex escaping involved.
        awk -v ver="$VERSION" '
          index($0, "## [" ver "]") == 1 { found=1; next }
          found && index($0, "## [") == 1 { exit }
          found { print }
        ' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md) for details." > release-notes.md
        fi
        {
          echo ""
          echo "**Full changelog**: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/master/CHANGELOG.md)"
        } >> release-notes.md
        cat release-notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        body_path: release-notes.md
        files: |
          dist/*.tar.gz
          dist/*.zip
          dist/checksums.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
